<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>URL Redirects</title>

  <link rel="stylesheet" href="../../styles/styles.css">
  <link rel="stylesheet" href="./mapper.css">
</head>

<body>
  <main class="slug-mapper">

    <!-- Header -->
    <header class="header">
      <div>
        <h2>Ul Redirects</h2>
        <p class="hint">wip</p>
      </div>

      <div class="actions">
        <button id="preview-csv">Preview CSV</button>
        <button id="export-csv" class="primary">Export CSV</button>
      </div>
    </header>

    <!-- From input -->
    <section class="inputs">
      <label>From Slugs</label>
      <div class="from-input-row">
        <textarea id="from-input" placeholder="/all-inventory/"></textarea>
        <button id="load-from">Load</button>
      </div>
    </section>

    <!-- Workspace -->
    <section class="workspace">

      <!-- Mapping table -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>From</th>
              <th>To</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="mapping-rows"></tbody>
        </table>
      </div>

      <!-- CMS reference -->
      <aside class="cms">
        <label>CMS Slugs</label>
        <input id="cms-search" placeholder="Search CMS slugs…" />
        <div id="cms-results"></div>
      </aside>

    </section>

    <!-- CSV Preview -->
    <dialog id="csv-dialog">
      <h4>CSV Preview</h4>
      <textarea id="csv-preview" readonly></textarea>
      <button id="close-csv">Close</button>
    </dialog>

  </main>

  <script src="./mapper.js"></script>
</body>
</html>
