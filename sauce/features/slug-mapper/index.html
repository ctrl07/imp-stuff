<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>URL Redirects Helper</title>

  <link rel="stylesheet" href="../../styles/styles.css">
  <link rel="stylesheet" href="./mapper.css">
</head>

<body>
  <main class="slug-mapper">

    <!-- Header -->
    <header class="header">
      <div class="title">
        <h2>URL Redirects Helper</h2>
        <p class="hint">Interaction driven redirect mapping</p>
      </div>

      <div class="top-inputs">
        <div class="input-box">
          <label>From URLs</label>
          <textarea id="fromInput"></textarea>
          <button id="loadFrom">Load</button>
        </div>

        <div class="input-box">
          <label>To Slugs</label>
          <textarea id="toInput"></textarea>
          <button id="loadTo">Load</button>
        </div>
      </div>
    </header>

    <!-- Workspace -->
    <section class="workspace">

      <!-- From rows -->
      <section class="from-panel">
        <div class="actions">
          <button id="previewCsv">Preview CSV</button>
          <button id="exportCsv">Export CSV</button>
        </div>

        <div id="fromTable"></div>
      </section>

      <!-- To stash -->
      <aside class="to-panel">
        <h4>To Slug Stash</h4>
        <div id="toStash"></div>
      </aside>

    </section>

    <!-- CSV Preview -->
    <dialog id="csvDialog">
      <textarea id="csvOutput" readonly></textarea>
      <button onclick="csvDialog.close()">Close</button>
    </dialog>

  </main>

  <script src="./mapper.js"></script>
</body>
</html>
