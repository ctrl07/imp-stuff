<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Website Inspector</title>
  <link rel="stylesheet" href="../../styles/styles.css">
</head>

<body>
  <div class="header-actions">
    <button id="refresh-data">Refresh Data</button>
    <button id="copy-slugs">Copy Slugs</button>
  </div>

  <div class="section">
    <h4>Page URL</h4>
    <div id="url-info"></div>
  </div>

  <div class="section">
    <h4>Website Provider</h4>
    <div id="provider-info"></div>
  </div>

  <div class="section">
    <h4>Meta Info</h4>
    <div id="meta-info"></div>
  </div>

  <div class="section">
    <h4>Address</h4>
    <div id="address-info"></div>
  </div>

  <div class="section">
    <h4>Location</h4>
    <div id="geo-info"></div>
  </div>

  <div class="section">
    <h4>Social Links</h4>
    <div id="social-info"></div>
  </div>

  <div class="section">
    <h4>GA / GTM</h4>
    <div id="analytics-info"></div>
  </div>

  <div class="section">
    <h4>Links</h4>
    <div class="header-actions">
      <button id="copy-links">Copy All</button>
    </div>
    <div id="link-list"></div>
  </div>

  <div class="section">
    <h4>Schema Snapshot</h4>
    <div class="header-actions">
      <button id="copy-schema-json">Copy JSON</button>
      <button id="download-schema-json">Download JSON</button>
    </div>
    <div id="schema-info"></div>
  </div>

  <div class="section">
    <h4>Script URLs</h4>
    <div class="header-actions">
      <button id="copy-scripts">Copy All</button>
    </div>
    <div id="script-list"></div>
  </div>

  <dialog id="slug-dialog">
    <h4>Slugs</h4>
    <textarea id="slug-text" readonly></textarea>

    <div class="dialog-actions">
      <button id="copy-slug-text">Copy</button>
      <button id="close-slug-dialog">Close</button>
    </div>
  </dialog>

  <script type="module" src="inspector.js"></script>
</body>
</html>
