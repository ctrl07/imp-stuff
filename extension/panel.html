<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>TARS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pico.min.css">
  <script src="panel.js" defer></script>
  <script src="url-opener-panel.js" defer></script>
  <script src="tools-panel.js" defer></script>
  <script src="compare-panel.js" defer></script>
  <style>
    :root {
      --pico-font-family: "Outfit", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --small-font-size: 0.85rem;
    }

    code, pre, kbd, textarea {
      font-family: "JetBrains Mono", "Courier New", monospace;
    }

    .hidden {
      display: none !important;
    }

    main {
      width: 100%;
      margin: 0;
      padding: 0.8rem 0.9rem 1rem;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-bottom: 0.6rem;
    }

    /* Tabs */

    .page-tabs {
      display: flex;
      gap: 0.3rem;
      border-bottom: 1px solid var(--pico-card-border-color);
      padding-bottom: 0.4rem;
      margin-bottom: 0.9rem;
    }

    .page-tab {
      width: auto;
      margin: 0;
      padding: 0.3rem 0.85rem;
      font-size: var(--small-font-size);
      border-radius: 0.4rem;
      background: transparent;
      color: var(--pico-muted-color);
      border: none;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .page-tab:focus-visible {
      outline: 2px solid var(--pico-color);
      outline-offset: 2px;
    }

    .page-tab.active {
      background: var(--pico-card-background-color);
      color: var(--pico-color);
    }

    .page-tab:hover:not(.active) {
      color: var(--pico-color);
    }

    /* Inspector */

    .inspector-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
      margin-bottom: 0.9rem;
    }

    .inspector-bar small {
      margin: 0;
      font-size: var(--small-font-size);
      color: var(--pico-muted-color);
    }

    button#refresh-button {
      width: auto;
      display: inline-block;
      font-size: var(--small-font-size);
      padding: 0.45rem 0.75rem;
      border-radius: 0.55rem;
    }

    fieldset {
      margin-bottom: 0.9rem;
      padding: 0;
      border: none;
    }

    fieldset {
      margin-bottom: 0.9rem;
    }

    fieldset.fieldset-compact {
      margin-top: 0.9rem;
      margin-bottom: 0.9rem;
    }

    fieldset legend {
      font-size: 0.88rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--pico-muted-color);
      margin-bottom: 0.45rem;
      padding: 0;
      width: auto;
    }

    section h3 {
      font-size: 1rem;
      margin: 0.9rem 0 0.6rem;
    }

    #ut-form h3 {
      font-size: 0.95rem;
      margin: 0.9rem 0 0.45rem;
    }

    .ut-section-title {
      margin-bottom: 0.6rem;
    }

    .ut-section-title-spaced {
      margin-top: 0.9rem;
      margin-bottom: 0.6rem;
    }

    .ut-label-spaced {
      margin-top: 0.6rem;
    }


    details {
      margin-bottom: 0.9rem;
    }

    .pico-btn-sm {
      padding: 0.22rem 0.6rem;
      font-size: 0.75rem;
      line-height: 1.4;
    }

    summary span.section-title {
      margin: 0;
      font-size: 1rem;
      display: inline;
      font-weight: 600;
    }

    .code-block {
      margin: 0.4rem 0 0;
      padding: 0.75rem 0.85rem;
      background: var(--pico-form-element-border-color);
      border-radius: 0.65rem;
      font-size: var(--small-font-size);
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      max-height: 240px;
      color: inherit;
      line-height: 1.6;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .code-block:hover {
      background: var(--pico-card-border-color);
    }

    #ut-category-breakdown details {
      margin-bottom: 0.6rem;
    }

    #ut-category-breakdown summary {
      cursor: pointer;
      user-select: none;
      font-weight: 500;
    }

    #ut-category-breakdown pre {
      cursor: pointer;
      margin-top: 0.4rem;
    }

    .tsv-output {
      display: grid;
      padding: 0 !important;
      background: none !important;
      border: 1px solid var(--pico-card-border-color);
    }

    .tsv-output > * {
      border-right: 1px solid var(--pico-card-border-color);
      border-bottom: 1px solid var(--pico-card-border-color);
      padding: 0.5rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* URL Stuff */

    .ops-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin: 0.5rem 0 0.75rem;
    }

    #url-status {
      display: block;
      font-size: var(--small-font-size);
      color: var(--pico-muted-color);
      margin-bottom: 0.6rem;
      min-height: 1.2em;
    }

    #ut-form label {
      display: inline;
      margin-bottom: 0;
    }

    .tool-textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 96px;
      padding: 0.75rem 0.85rem;
      background: var(--pico-form-element-border-color);
      border: none;
      border-radius: 0.65rem;
      color: var(--pico-color);
      font-family: monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      resize: vertical;
      transition: background 0.2s ease;
    }

    .tool-textarea:focus {
      outline: none;
      background: var(--pico-card-border-color);
    }

    .tool-textarea::placeholder {
      color: var(--pico-muted-color);
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: var(--small-font-size);
      margin-bottom: 0.6rem;
      gap: 0.5rem;
    }

    .slider-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="range"] {
      width: 110px;
      accent-color: var(--pico-color);
      cursor: pointer;
    }

    #threshold-label {
      font-variant-numeric: tabular-nums;
      min-width: 2.8em;
      text-align: right;
    }

    .code-wrap {
      position: relative;
    }

    .inner-copy-btn {
      position: absolute;
      top: 0.4rem;
      right: 0.4rem;
      z-index: 1;
      width: auto !important;
      margin: 0 !important;
      padding: 0.18rem 0.5rem;
      font-size: 0.72rem;
      line-height: 1.4;
      border-radius: 0.35rem;
      background: var(--pico-card-background-color);
      color: var(--pico-color);
      border: none;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .inner-copy-btn:hover {
      background: var(--pico-card-border-color);
    }

    .scratch-pad {
      min-height: 180px;
      margin-top: 0.5rem;
    }

    /* Compare */

    .cp-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.35rem 0;
      border-bottom: 1px solid var(--pico-card-border-color);
    }

    .cp-label {
      font-size: var(--small-font-size);
      color: var(--pico-muted-color);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
  </style>
</head>
<body>
  <main>
    <nav class="page-tabs" role="tablist">
      <button class="page-tab active" data-page="url-opener" role="tab" aria-selected="true" aria-controls="page-url-opener">Launch</button>
      <button class="page-tab" data-page="tools" role="tab" aria-selected="false" aria-controls="page-tools">Tools</button>
      <button class="page-tab" data-page="compare" role="tab" aria-selected="false" aria-controls="page-compare">Migrate [WIP]</button>
    </nav>

    <div id="page-url-opener" class="page">
      <fieldset>
        <legend>Dealer ID</legend>
        <input type="text" id="uo-id-input" placeholder="Enter dealer ID…" autocomplete="off">
      </fieldset>
      <div id="uo-buttons" class="ops-row"></div>
      <hr>
      <textarea class="tool-textarea scratch-pad" placeholder="Scratch pad…" spellcheck="false"></textarea>
    </div>

    <div id="page-tools" class="page hidden">

      <!-- Tool 1: Page Links -->
      <fieldset>
        <legend>Page Links</legend>
        <div class="ops-row">
          <button type="button" class="outline secondary pico-btn-sm" id="tp-export-links">Export Links</button>
        </div>
        <small id="tp-links-status"></small>
      </fieldset>

      <hr>

      <!-- Tool 2: Sitemap XML -->
      <fieldset>
        <legend>Sitemap XML</legend>
        <textarea id="tp-sitemap-input" class="tool-textarea" placeholder="Paste sitemap XML…" spellcheck="false"></textarea>
        <div class="ops-row">
          <button type="button" class="outline secondary pico-btn-sm" id="tp-parse-sitemap">Parse</button>
        </div>
        <small id="tp-sitemap-status"></small>
      </fieldset>

      <hr>

      <!-- Tool 3: WordPress XML → CSV -->
      <fieldset>
        <legend>WordPress Export → CSV</legend>
        <input type="file" id="tp-wp-file" accept=".xml" style="display:none">
        <div class="ops-row">
          <label for="tp-wp-file" class="outline secondary pico-btn-sm" id="tp-wp-label" style="cursor:pointer;margin:0">Choose file</label>
          <button type="button" class="outline secondary pico-btn-sm" id="tp-convert-wp" disabled>Convert</button>
        </div>
        <small id="tp-wp-status"></small>
      </fieldset>

    </div>

    <div id="page-compare" class="page hidden">
      <fieldset>
        <legend>URL Map</legend>
        <input type="file" id="cp-file" accept=".csv" style="display:none">
        <div class="ops-row">
          <label for="cp-file" class="outline secondary pico-btn-sm" id="cp-file-label" style="cursor:pointer;margin:0">Choose CSV</label>
        </div>
        <small id="cp-status"></small>
      </fieldset>
      <div id="cp-list"></div>
    </div>

  </main>
</body>
</html>
